name: Deploy to Firebase Hosting

# Every change merged into main is checked and published to https://lzfortuna.web.app.
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT (JSON key of a service account
# with the "Firebase Hosting Admin" role). Without it the job checks the site and skips the deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Deploy
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::notice::FIREBASE_SERVICE_ACCOUNT is not set; skipping deploy."
            exit 0
          fi
          key="$RUNNER_TEMP/firebase-key.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key"
          GOOGLE_APPLICATION_CREDENTIALS="$key" npm run deploy
          rm -f "$key"
