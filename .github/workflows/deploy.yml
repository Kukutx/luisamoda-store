name: Deploy to Firebase Hosting

# Every change merged into main is checked and published to https://lzfortuna.web.app.
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT (JSON key of a service account
# with the "Firebase Hosting Admin" and "Service Usage Consumer" roles). Without it the job checks the site and skips the deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Deploy
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::notice::FIREBASE_SERVICE_ACCOUNT is not set; skipping deploy."
            exit 0
          fi
          key="$RUNNER_TEMP/firebase-key.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key"
          GOOGLE_APPLICATION_CREDENTIALS="$key" npm run deploy
          rm -f "$key"
      - name: Check the live site
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then exit 0; fi
          # The live homepage must reference the same hashed script as this build.
          marker=$(grep -o '/_next/static/[^"]*\.js' out/index.html | head -1)
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS https://lzfortuna.web.app/ | grep -qF "$marker"; then break; fi
            if [ "$attempt" = 6 ]; then echo "::error::The live homepage is not the build just deployed."; exit 1; fi
            sleep 10
          done
          for path in / /sartoria/ /prodotti/ /sitemap.xml; do
            curl -fsS -o /dev/null "https://lzfortuna.web.app$path"
          done
          echo "Live site is up to date: https://lzfortuna.web.app"
